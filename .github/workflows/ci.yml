name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types & production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dormitory_test
      APP_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dormitory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dormitory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Set up pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate database client
        run: pnpm exec prisma generate
      - name: Apply migrations to test database
        run: pnpm run db:migrate
      - name: Run unit and PostgreSQL integration tests
        run: pnpm exec vitest run --maxWorkers=1 --no-file-parallelism
      - name: Check TypeScript
        run: pnpm run typecheck
      - name: Build application
        run: pnpm run build
